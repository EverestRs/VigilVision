enabled: true
review_mode: async
trigger_classes: [H01, H02, H03, H04, H05, M01, M02, M03, S01, S02]
# 运行时灰色地带复核区间 (PoseClassifier 置信度)
confidence_gray_zone: [0.55, 0.85]
runtime_gray_low: 0.40
runtime_gray_high: 0.75
# 模型配置
model_name: qwen2.5-vl-7b-instruct
# 相对路径以项目根目录（campus_security_agent/）为基准；Qwen2.5-VL-7B-Instruct 与项目目录同级
model_path: ../Qwen2.5-VL-7B-Instruct
prompt_template: "分析图中人员的行为。请先用一句话描述其动作过程（描述画面中可见的具体证据），再判断行为类别。选项：Normal(正常), H01(打架斗殴), H02(校园霸凌), H03(跌倒/昏厥), H04(疑似轻生), H05(破坏设施), M01(吸烟), M02(使用手机), M03(遮挡摄像头), S01(异常徘徊), S02(翻越围栏)。M01 判定要领：监控画面中香烟往往很小甚至不可见；吸烟的典型证据是手指间夹持细长物（烟）举向嘴部并伴随吸气动作。办公/会议场景中手部靠近面部的动作绝大多数是托腮、扶眼镜、整理头发、喝水、进食、写字翻页——这些一律判 Normal，不得仅凭手靠近嘴部判 M01。只有当你能在画面中辨认出细长烟具或烟雾时才判 M01；辨认不出时判 Normal。仅输出JSON格式，不要包含其他文字，例如：{\"description\": \"该人员手指夹持细长物举向嘴部，手部动作反复，疑似吸烟\", \"label\": \"M01\", \"confidence\": 0.85}"
# 推理框架: true=vLLM(离线批标注), false=transformers(运行时复核)
# B3: 全局 VLM 并发槽位（vLLM continuous batching 上限保护，防 KV cache 挤爆）
vlm_router:
  max_concurrent_requests: 4

use_vllm: true
vllm_url: http://localhost:8001/v1/chat/completions
# 延迟预算（离线标注用较大值）
max_latency_ms_gpu: 60000
max_latency_ms_cpu: 120000
# 复核生成 token 上限：链式输出（description+label+confidence）在灰区上下文注入后变长，
# 旧值 128 会截断 JSON 落入关键词兜底（WEAKNESS_AUDIT #2）
review_max_tokens: 256

# ── 场景叙述器 (SceneNarrator)：周期性对整个场景生成中文叙述 ──
scene_narrator:
  enabled: true
  narrate_interval_seconds: 20   # 每隔多少秒视频时间叙述一次
  frames_per_narration: 4        # 每次送入 VLM 的关键帧数
  summary_window: 10             # 滚动摘要覆盖的最近叙述条数
  summary_refresh_every: 5       # 每新增多少条叙述重建一次滚动摘要
  max_image_px: 768
  max_latency_ms: 15000
  failure_backoff_seconds: 30    # vLLM 调用失败后的退避时长
  auto_refresh_seconds: 5        # 前端自动刷新间隔（场景理解面板轮询 period）
  important_dedupe_seconds: 120  # 同类重要理解在该视频时间窗口内只推一次
  # 重要理解关键词兜底（notable_activities / 检测联动非空时无需依赖关键词）
  important_keywords:
    - 跌倒
    - 昏厥
    - 倒地
    - 打架
    - 霸凌
    - 轻生
    - 翻越
    - 闯入
    - 破坏
    - 吸烟
    - 遮挡
    - 徘徊

# ── 告警事件裁决器 (AlertAdjudicator)：告警触发后异步两趟复核 ──
alert_adjudicator:
  enabled: true
  before_seconds: 5              # 裁决窗口：告警前 N 秒
  after_seconds: 5               # 裁决窗口：告警后 N 秒（收满才发起）
  frames_per_call: 6
  max_image_px: 512
  max_latency_ms: 30000
  failure_backoff_seconds: 30
  max_pending_alerts: 4          # 待裁决队列上限（告警爆发期有界排队，超出丢弃并计数）

# ── 环形帧缓冲（叙述器与裁决器共用，降采样存储；窗口淘汰按视频时间执行） ──
frame_buffer:
  max_seconds: 30
  samples_per_second: 2
  target_width: 960

# ── 原帧复核缓冲（person-crop 专用，直存原始分辨率）──
# 只用于取近帧裁剪，独立收口防止内存膨胀：48 帧 ≈ 300MB@1080p
# （旧实现继承 30s×10fps=300 帧 ≈ 1.9GB，WEAKNESS_AUDIT #9）
frame_buffer_orig:
  max_seconds: 12
  max_frames: 48

# ── 场景知识库 (SceneIndex)：BM25 检索 + 可选向量重排 ──
scene_index:
  enabled: true
  use_vector: true
  vector_model_path: models/embedding/bge-small-zh-v1.5   # 本地嵌入模型，缺失时自动降级为纯 BM25

# ── 强制 VLM 复核：高风险类别越过置信度三级决策，直接逐目标复核 ──
force_vlm_review:
  classes: [H03, M01, M02]  # 跌倒易与坐姿混淆；吸烟/手机需看清手部动作，均强制大模型复核
  throttle_frames: 75   # 同一目标两次复核的最小间隔（处理帧数）≈6s@12fps；25 时实测 28 次/分钟会把检测吞吐压低 ~30%
  max_per_minute: 8     # 全局复核预算（令牌桶）；VLM 与 ONNX 共用 GPU，超过会拖慢检测导致画面框滞后
  veto_cache_frames: 300  # 复核结论的有效期（≈25s）：VLM 单次往返常超过 75 帧，
                          # 用 75 会把迟到的否决当成过期丢弃（强几何 H03 永远无法被否决）
  geom_strong_parallel_review: true  # 强几何 H03 立即告警的同时并行送 VLM，迟到否决可回撤后续帧

# ── 自然语言告警规则引擎：一句话定义告警（闭集映射 + 开放词汇判定）──
discovery:
  enabled: true                 # VLM 发现器：事件触发 + 周期采样（异步，不覆盖主判定）
  periodic_interval_sec: 90     # 每个 track 至少每 90s 送审一次（覆盖"无触发但确实有事"）
  per_track_cooldown_sec: 30    # 同一 track 两次送审最小间隔
  budget_per_hour: 600          # 全局调用预算（令牌桶）；M01 双窗需要连续 2 次，240 会把第二次卡掉
  burst: 8                      # 令牌桶容量（允许短时突发）
  max_inflight: 2               # 同时进行的发现调用上限（与复核共享 GPU，过高会拖慢检测）
  min_track_age_frames: 24      # 新 track 先稳定 ~2s 再送审
  min_track_score: 0.35         # 目标置信度下限
  low_conf_threshold: 0.40      # PC 低置信触发阈值
  # M01 专用通道：仅人物裁剪 + 定向 prompt + 双窗时序一致性
  # 实测依据：pano+crop+通用 prompt 在四种分辨率下 0/5；crop-only+定向 prompt 3/5；两帧 5/5（负样本 1/4）
  m01_enabled: true
  m01_image_max_px: 1024        # 人物裁剪目标边长（小目标会放大，但注意力集中在人）
  m01_cooldown_sec: 2.5         # 必须 >= 双窗间隔，否则第二次会落在 too_soon
  m01_window_gap_sec: 2.0       # 两个时间窗的最小间隔（视频时间）
  m01_confirm_cooldown_sec: 30  # 确认后进入长冷却，避免同一段反复确认
  m01_require_dual_window: true # false=单窗即确认（仅调试）
  # M02 手机通道：与 M01 同构（裁剪-only + 定向 prompt + 双窗）
  m02_enabled: true
  m02_image_max_px: 1024
  m02_cooldown_sec: 2.5
  m02_window_gap_sec: 2.0
  m02_confirm_cooldown_sec: 30
  m02_require_dual_window: true
  # H 类通道：H01/H02 双人（pair 聚合 + 2-of-3 投票）；H03/H04/H05 单人/场景（全景+裁剪 + 2-of-3）
  h_pair_enabled: true
  h_pair_image_max_px: 1024
  h_pair_cooldown_sec: 4.0
  h_pair_confirm_cooldown_sec: 20
  h_pair_vote_window_sec: 10
  h_pair_vote_min_hits: 2
  h_single_enabled: true
  h_single_image_max_px: 1024
  h_single_cooldown_sec: 4.0
  h_single_confirm_cooldown_sec: 20
  h_single_vote_window_sec: 10
  h_single_vote_min_hits: 2
  record_path: results/discovery/discovery_events.jsonl

nl_rule_engine:
  enabled: true
  open_check_interval_seconds: 15   # 开放词汇规则的定时判定周期（视频时间）
  expedited_check_gap_seconds: 6    # 场景叙述报告异常活动后的加急判定最小间隔
  frames_per_check: 4
  rule_cooldown_seconds: 10         # 同一规则两次告警的最小视频时间间隔
  require_confirmed_source: true    # P0-3：闭集规则只接受已确认来源（规则确认/VLM复核），拒绝 rule_pending、pc 高置信直通
  default_min_confidence: 0.6
  max_image_px: 512
  max_latency_ms: 20000
  failure_backoff_seconds: 30
  max_open_checks_per_cycle: 3      # 单轮开放词汇判定调用预算（ROADMAP Stage 2 前置：防规则数×独立调用打爆 vLLM）

# ── 新行为备忘 (ROADMAP Stage 1)：事件级触发，描述体系外行为并落盘证据 ──
novel_behavior:
  enabled: true
  window_seconds: 5                 # 取告警前后 ±N 秒环形缓冲帧
  scene_frames: 4                   # 场景帧数
  crop_frames: 3                    # person crop 帧数（原帧缓冲）
  max_image_px: 768
  gray_low: 0.40                    # 触发器B：Normal 且置信度落此区间 → 分类器"说不清"
  gray_high: 0.55
  track_cooldown_frames: 200        # 同一目标两次备忘的最小处理帧间隔
  activity_cooldown_seconds: 60     # 同一叙述活动指纹的最小视频时间间隔
  max_queue: 3
  max_latency_ms: 20000
  failure_backoff_seconds: 30

# ── 行为原型库 (ROADMAP Stage 2)：备忘聚类 → VLM 起名 → 人工终审 → 自写规则 ──
behavior_prototypes:
  enabled: true
  recall_floor: 0.55               # 嵌入召回下限（E2E 实测固定嵌入阈值无分离带：错误描述与
                                   # 正确描述的词面距离可能更近；归簇精判由 VLM"是否同类动作"承担）
  min_occurrences: 2               # 簇出现 N 次后转待命名（unknown_events 小样本验证集用 2；真实校园任务建议 3+）
  vector_model_path: models/embedding/bge-small-zh-v1.5
  device: cpu                      # 嵌入跑 CPU，不与用户 GPU 进程争资源
  max_latency_ms: 20000


